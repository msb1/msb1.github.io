---
layout: default
---

<article class="content-page">
  <p class="eyebrow">Writing</p>
  <h1>{{ page.title }}</h1>
  <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  <div class="post-content">
    {{ content }}
  </div>
</article>
