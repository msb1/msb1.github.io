<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <main class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}#bio">Bio</a>
          <a href="{{ '/' | relative_url }}#expertise">Expertise</a>
          <a href="{{ '/' | relative_url }}#writing">Writing</a>
        </nav>
      </header>
      {% if page.page_shell %}
      <article class="content-page">
        {{ content }}
      </article>
      {% else %}
      {{ content }}
      {% endif %}
      <footer class="site-footer">© {{ 'now' | date: '%Y' }} {{ site.title }}</footer>
    </main>
  </body>
</html>
